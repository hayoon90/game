<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셀 먹기 IO</title>
<style>
:root{--bg:#f4f6ff;--grid:#dfe3f5;--fg:#1a1d3a;--card:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--grid:#1c2144;--fg:#fff;--card:#1c2144d9}}
:root[data-theme="dark"]{--bg:#0f1226;--grid:#1c2144;--fg:#fff;--card:#1c2144d9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud,#lb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));pointer-events:none;font-size:14px;background:var(--card);padding:8px 12px;border-radius:10px}
#hud{left:10px;font-weight:700}
#lb{right:10px;min-width:110px;line-height:1.5}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0006}
#box{background:var(--card);backdrop-filter:blur(6px);padding:24px;border-radius:16px;text-align:center;width:min(300px,86vw)}
#sp,#bs,#ejb{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;margin:0;padding:0;display:none;z-index:2;touch-action:none}
#bs{right:104px;background:#ff8a3d;border-color:#ff8a3d}
#ejb{right:192px;background:#2fb7d8;border-color:#2fb7d8}
#cp{margin-bottom:12px}.sw{display:inline-block;width:28px;height:28px;border-radius:50%;margin:3px;border:3px solid transparent;cursor:pointer;box-sizing:border-box}.sw.on{border-color:var(--fg)}
h1{margin:0 0 6px;font-size:26px}
p{margin:4px 0 14px;font-size:14px;opacity:.8}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:2px solid var(--grid);background:var(--bg);color:var(--fg);margin-bottom:10px;text-align:center}
button{background:#5b6cff;border-color:#5b6cff;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
</style></head><body>
<canvas id="c"></canvas>
<button id="sp">분열</button><button id="bs">가속</button><button id="ejb">뱉기</button>
<div id="hud">질량 0</div><div id="lb"></div>
<div id="ov"><div id="box"><h1>셀 먹기 IO</h1>
<p id="msg">마우스/손가락 방향으로 이동해요.<br>스페이스: 분열 · W: 가속 · E: 질량 뱉기<br>시작 후 3초는 무적이에요.<br>초록 바이러스는 크면 터지고, 작으면 숨을 수 있어요.</p>
<input id="nm" maxlength="10" placeholder="닉네임"><div id="cp"></div><p id="net" style="font-size:12px;margin:0 0 10px">서버에 연결 중…</p><button id="go" disabled>시작</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),ov=$('ov'),nm=$('nm'),msg=$('msg'),go=$('go'),hud=$('hud'),lb=$('lb'),sp=$('sp'),bs=$('bs'),ejb=$('ejb'),net=$('net');
const cols=['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#a29bfe','#ff9ff3','#fd9644'];
const rad=m=>Math.sqrt(m)*3.2;
let W,H,dpr,cs={},S=3000,ws=null,ready=0,myId=0,state='menu',foods=[],cl=new Map(),vir=[],ejs=[],lbd=[],np=0;
let tx=0,ty=0,myc=null,best=0,score=0,cam={x:1500,y:1500,z:1},tick=0;
try{best=+localStorage.getItem('cellio-best')||0}catch(e){}

function colors(){const s=getComputedStyle(document.documentElement);cs={bg:s.getPropertyValue('--bg').trim(),grid:s.getPropertyValue('--grid').trim(),fg:s.getPropertyValue('--fg').trim()}}
colors();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',colors);
function rs(){dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',rs);rs();

// ---------- 서버 연결 ----------
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function showBtns(on){sp.style.display=bs.style.display=ejb.style.display=on?'block':'none'}
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{ready=1;go.disabled=false;net.textContent='서버에 연결됐어요'};
 ws.onclose=()=>{ready=0;go.disabled=true;net.textContent='연결이 끊겼어요 · 다시 연결 중…';
  if(state==='play'){state='menu';showBtns(0);msg.textContent='연결이 끊겼어요. 잠시 뒤 다시 시작하세요.';ov.style.display='flex'}
  cl.clear();setTimeout(connect,1500)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onMsg(m)};
}
function onMsg(m){
 if(m.t==='init'){myId=m.id;S=m.S;foods=m.foods.map(f=>({x:f[0],y:f[1],c:f[2]}))}
 else if(m.t==='s'){
  const seen=new Set();
  for(const a of m.c){const id=a[0];seen.add(id);let c=cl.get(id);
   if(!c){c={id,x:a[2],y:a[3],m:a[4]};cl.set(id,c)}
   c.o=a[1];c.tx=a[2];c.ty=a[3];c.tm=a[4];c.c=a[5];c.n=a[6];c.pr=a[7]}
  for(const id of cl.keys())if(!seen.has(id))cl.delete(id);
  vir=m.v;ejs=m.e;
  for(const f of m.f)foods[f[0]]={x:f[1],y:f[2],c:f[3]};
  if(m.lb){lbd=m.lb;np=m.np;if(state!=='play')net.textContent='👥 접속 '+np+'명'}
 }else if(m.t==='dead'){
  state='over';showBtns(0);const s=m.score;
  if(s>best){best=s;try{localStorage.setItem('cellio-best',best)}catch(e){}}
  msg.textContent=(m.by?m.by+'에게 ':'')+'잡아먹혔어요! 질량 '+s+' · 최고 '+best;go.textContent='다시 시작';ov.style.display='flex';
 }else if(m.t==='full'){msg.textContent='서버가 가득 찼어요. 잠시 뒤 다시 시도하세요.'}
}
function start(){if(!ready)return;send({t:'join',name:nm.value.trim().slice(0,10)||'나',color:myc});state='play';ov.style.display='none';showBtns(1)}
go.addEventListener('click',start);
nm.addEventListener('keydown',e=>{if(e.key==='Enter')start()});

// ---------- 입력 ----------
function aim(e){tx=e.clientX-W/2;ty=e.clientY-H/2}
cv.addEventListener('pointermove',aim);cv.addEventListener('pointerdown',aim);
setInterval(()=>{if(state==='play')send({t:'in',x:Math.round(cam.x+tx/cam.z),y:Math.round(cam.y+ty/cam.z),z:+cam.z.toFixed(3)})},50);
const split=()=>{if(state==='play')send({t:'split'})},eject=()=>{if(state==='play')send({t:'eject'})},boost=v=>send({t:'boost',v});
addEventListener('keydown',e=>{if(e.target===nm)return;
 if(e.code==='KeyE'){eject();return}
 if(e.repeat)return;
 if(e.code==='Space'){e.preventDefault();split()}else if(e.code==='KeyW')boost(1)});
addEventListener('keyup',e=>{if(e.code==='KeyW')boost(0)});
sp.addEventListener('pointerdown',e=>{e.preventDefault();split()});
ejb.addEventListener('pointerdown',e=>{e.preventDefault();eject()});
bs.addEventListener('pointerdown',e=>{e.preventDefault();boost(1)});
['pointerup','pointercancel','pointerleave'].forEach(t=>bs.addEventListener(t,()=>boost(0)));

// ---------- 그리기 ----------
function spike(v,r){ctx.globalAlpha=1;ctx.beginPath();for(let i=0;i<=40;i++){const a=i/40*6.283,rr=i%2?r:r+7;ctx.lineTo(v.x+Math.cos(a)*rr,v.y+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle='#33d17a';ctx.fill();ctx.strokeStyle='#1a8f4d';ctx.lineWidth=3;ctx.stroke()}
function mini(){ctx.setTransform(dpr,0,0,dpr,0,0);const s=Math.min(110,W*.28),x0=10,y0=H-s-10;
 ctx.save();ctx.beginPath();ctx.rect(x0,y0,s,s);ctx.clip();
 ctx.globalAlpha=.6;ctx.fillStyle=cs.bg;ctx.fillRect(x0,y0,s,s);ctx.globalAlpha=1;
 for(const v of vir){ctx.fillStyle='#33d17a';ctx.beginPath();ctx.arc(x0+v[0]/S*s,y0+v[1]/S*s,1.8,0,7);ctx.fill()}
 for(const c of cl.values()){const mine=c.o===myId&&myId,pl=c.o>0;ctx.fillStyle=mine?cs.fg:pl?c.c:'#8890b8';ctx.beginPath();ctx.arc(x0+c.x/S*s,y0+c.y/S*s,mine||pl?3:1.8,0,7);ctx.fill()}
 ctx.strokeStyle=cs.fg;ctx.lineWidth=1;ctx.strokeRect(x0+(cam.x-W/2/cam.z)/S*s,y0+(cam.y-H/2/cam.z)/S*s,W/cam.z/S*s,H/cam.z/S*s);
 ctx.restore();ctx.strokeStyle=cs.fg;ctx.lineWidth=1.5;ctx.strokeRect(x0,y0,s,s)}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=cs.bg;ctx.fillRect(0,0,W,H);
 let cx=cam.x,cy=cam.y,cm=20,tm=0,n=0;
 if(myId)for(const c of cl.values())if(c.o===myId){tm+=c.m;n++}
 if(n){cx=0;cy=0;for(const c of cl.values())if(c.o===myId){cx+=c.x*c.m;cy+=c.y*c.m}cx/=tm;cy/=tm;cm=tm;score=Math.floor(tm)}
 else if(state!=='play'){cx=S/2;cy=S/2;cm=2000;score=0}
 const z=Math.min(1,40/rad(cm))**.5;cam.x=cx;cam.y=cy;cam.z=z;
 ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
 ctx.strokeStyle=cs.grid;ctx.lineWidth=1;ctx.beginPath();
 for(let i=0;i<=S;i+=100){ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.moveTo(0,i);ctx.lineTo(S,i)}ctx.stroke();
 ctx.strokeStyle=cs.fg;ctx.lineWidth=6;ctx.strokeRect(0,0,S,S);
 for(const o of foods){if(!o)continue;ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill()}
 for(const e of ejs){ctx.fillStyle=e[3];ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e[0],e[1],rad(e[2])*.8,0,7);ctx.fill();ctx.stroke()}
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
 const list=[...cl.values(),...vir.map(v=>({virus:1,x:v[0],y:v[1],m:v[2]}))].sort((a,b)=>a.m-b.m);
 for(const c of list){const r=rad(c.m);if(c.virus){spike(c,r);continue}
  ctx.globalAlpha=c.pr?.5:1;ctx.fillStyle=c.c;ctx.strokeStyle=(c.o>0&&c.o!==myId)?cs.fg:'rgba(0,0,0,.25)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.fill();ctx.stroke();
  ctx.font='bold '+Math.max(12,r*.45)+'px sans-serif';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.fillStyle='#fff';
  ctx.strokeText(c.n,c.x,c.y);ctx.fillText(c.n,c.x,c.y);ctx.globalAlpha=1}
 mini()}
function ui(){
 hud.textContent=state==='play'?'질량 '+score+' · 최고 '+Math.max(best,score):'최고 '+best;
 const nr=np;lb.textContent='';const h=document.createElement('b');h.textContent='🏆 순위'+(nr>1?' · 👥'+nr:'');lb.append(h);
 lbd.forEach((a,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+a[0]+' '+a[1];if(a[2]&&a[2]===myId)d.style.fontWeight=700;lb.append(d)})}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const k=1-Math.exp(-dt*18);
 for(const c of cl.values()){c.x+=(c.tx-c.x)*k;c.y+=(c.ty-c.y)*k;c.m+=(c.tm-c.m)*k}
 draw();if(++tick%10===0)ui();requestAnimationFrame(loop)}

const cp=$('cp');cols.forEach(c=>{const s=document.createElement('div');s.className='sw';s.style.background=c;s.onclick=()=>{myc=c;[...cp.children].forEach(x=>x.classList.toggle('on',x===s))};cp.append(s)});
connect();requestAnimationFrame(loop);
</script></body></html>
